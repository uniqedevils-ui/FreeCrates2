name: Build FreeCrates

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Extract source ZIP
        run: |
          unzip -q FreeCrates-1.0.0-Paper26.2-source.zip
          mv FreeCrates-1.0.0-Paper26.2 project

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1'

      - name: Build
        working-directory: project
        run: gradle clean build

      - name: Upload FreeCrates JAR
        uses: actions/upload-artifact@v4
        with:
          name: FreeCrates-JAR
          path: project/build/libs/*.jar
